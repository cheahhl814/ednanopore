[workspace]
name = "ednanopore"
version = "0.5.0"
description = "Agent-driven Nanopore 16S eDNA metabarcoding: three cross-classification methods (minimap2/RefSeq, IdTaxa/SILVA consensus and read-based), with reference-database retrieval delegated to biodb-fetch."
channels = ["conda-forge", "bioconda"]
# linux-64 only: the validated per-run tool pins (medaka/julia/bioconductor stack) do not
# resolve for all platforms; this skill is developed and run on linux HPC boxes.
platforms = ["linux-64"]

[dependencies]
# Shared runtime for the reference-db helper scripts, update-check and test fixtures.
python = ">=3.11,<3.13"

# CheckM (validation) crashes on Python >=3.12 with setuptools >=81:
# "ModuleNotFoundError: No module named 'pkg_resources'" (pkg_resources was
# removed from setuptools in 81). Pin setuptools until checkm-genome is
# updated upstream to not depend on pkg_resources.
# setuptools = "<81"  # uncomment if CheckM is used (in CheckM's feature table if it is isolated)

# Isolated env: these tools failed to co-solve with [dependencies] at preflight (step 2h joint solve).
# Run them with `pixi run -e qc <cmd>`.
[feature.qc.dependencies]
chopper = ">=0.8.0,<0.9"
cutadapt = ">=5.2,<6"
nanoplot = ">=1.46.0,<2"
# latent bug fixed: run_readbased_idtaxa.sh calls `seqkit fq2fa` in the qc env
# but seqkit was declared nowhere — it lives in bioconda, confirmed in preflight.
seqkit = ">=2.4,<3"
python = ">=3.11,<3.13"

# Isolated env: these tools failed to co-solve with [dependencies] at preflight (step 2h joint solve).
# Run them with `pixi run -e classification <cmd>`.
[feature.classification.dependencies]
minimap2 = ">=2.27,<3"
kraken2 = ">=2.1.3,<3"
seqtk = ">=1.5,<2"
r-base = "4.5.*"
# R stack needed by bin/idtaxa_rds.R + classification helpers (v0.3.0→v0.4.0
# consolidation regression, caught by the first real subsample run):
r-argparse = ">=2.3.1,<3"
"r-data.table" = ">=1.17.8,<2"
bioconductor-decipher = ">=3.6.0,<4"
bioconductor-genomeinfodb = ">=1.42.0,<2"
bioconductor-s4vectors = ">=0.48.0,<0.49"
bioconductor-mia = ">=1.18.0,<2"
r-ggplot2 = ">=4.0.2,<5"
bioconductor-miaviz = ">=1.18.0,<2"

# Isolated env: these tools failed to co-solve with [dependencies] at preflight (step 2h joint solve).
# Run them with `pixi run -e cluster <cmd>`.
[feature.cluster.dependencies]
# v0.2.0 battle-test fix: medaka env breaks with setuptools >= 81 (pkg_resources removal).
setuptools = "<81"
medaka = ">=2.0.1,<3"
yacrd = ">=0.6.2,<0.7"
biom-format = ">=2.1.17,<3"
samtools = ">=1.19,<2"

# Isolated env: these tools failed to co-solve with [dependencies] at preflight (step 2h joint solve).
# Run them with `pixi run -e diversity <cmd>`.
[feature.diversity.dependencies]
mafft = ">=7.526,<8"
fasttree = ">=2.2.0,<3"

# Isolated env: these tools failed to co-solve with [dependencies] at preflight (step 2h joint solve).
# Run them with `pixi run -e decontam <cmd>`.
[feature.decontam.dependencies]
julia = ">=1.12.2,<1.13"

[feature.decontam.activation]
env = { JULIA_PROJECT = "${PIXI_PROJECT_ROOT}/runners/manual-runner/env/decontam" }

[tasks]
# Common workflows as pixi tasks
preflight = "echo 'Starting preflight workflow...'"
run = "echo 'Starting main workflow...'"
qc = "echo 'Starting QC workflow...'"
debug = "echo 'Starting debug workflow...'"
battle-test = "echo 'Starting battle-test workflow...'"
# Self-check: compares this skill's git SHA to upstream (github.com/cheahhl814/ednanopore).
# See bin/skill-update-check.py for the verdict legend (UP-TO-DATE / BEHIND-BY-N / OFFLINE).
update-check = "python3 bin/skill-update-check.py"

[environments]
qc = { features = ["qc"], no-default-feature = true }
classification = { features = ["classification"], no-default-feature = true }
cluster = { features = ["cluster"], no-default-feature = true }
diversity = { features = ["diversity"], no-default-feature = true }
decontam = { features = ["decontam"], no-default-feature = true }
association = { features = ["association"], no-default-feature = true }
# Isolated env: R/Bioc analysis stack (association + correlation + typing scripts).
# Run with `pixi run -e association <Rscript>`.
[feature.association.dependencies]
r-base = "4.5.*"
r-argparse = ">=2.3.1,<3"
"r-data.table" = ">=1.17.8,<2"
r-ggplot2 = ">=4.0.2,<5"
r-dplyr = ">=1.2.0,<2"
r-patchwork = ">=1.3.2,<2"
bioconductor-mia = ">=1.18.0,<2"
bioconductor-s4vectors = ">=0.48.0,<0.49"
bioconductor-miaviz = ">=1.18.0,<2"
bioconductor-complexheatmap = ">=2.22.0,<3"
bioconductor-genomeinfodb = ">=1.42.0,<2"
r-igraph = ">=2.1.4,<3"
r-qgraph = ">=1.9.8,<2"
r-shadowtext = ">=0.1.6,<0.2"
r-tidyr = ">=1.3.2,<2"
r-circlize = ">=0.4.17,<0.5"
r-biocmanager = ">=1.30.0,<2"
r-nloptr = ">=2.2.1,<3"
r-lme4 = ">=2.0_1,<3"
r-pbkrtest = ">=0.5.5,<0.6"
r-lmertest = ">=3.2_1,<4"
r-car = ">=3.1_5,<4"
r-glmmtmb = ">=1.1.14,<2"
